<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vida en juego</title>
<style>
:root{--bg:#10131d;--panel:#191e2b;--panel2:#202637;--line:#30394e;--text:#f5f7ff;--muted:#9aa6bf;--lime:#c5f36a;--cyan:#71e2dc;--pink:#ff8fbd;--gold:#ffd276;--blue:#7aa8ff;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 70% -10%,#29334b 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:17px;letter-spacing:-.02em;margin:0}h3{font-size:14px;margin:0}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;font-weight:800;color:var(--lime)}
.muted{color:var(--muted)}.small{font-size:12px}
.card{background:linear-gradient(145deg,rgba(29,35,51,.97),rgba(23,28,41,.97));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.pill{border:1px solid var(--line);background:#171c29;border-radius:99px;padding:5px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill.gold{color:var(--gold);font-weight:700}
.badge{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--lime);color:#202718;font-weight:900;font-size:21px;flex:none}
.track{height:8px;background:#343d50;border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:linear-gradient(90deg,var(--lime),#e3ff9f);border-radius:99px;transition:width .4s}
.habit{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#1b2130;margin-top:9px}
.habit.done{border-color:#91b85088;background:#263124}
.check{width:36px;height:36px;border:1px solid #46516a;border-radius:12px;background:#222a3b;display:grid;place-items:center;flex:none;font-size:17px}
.done .check{background:var(--lime);border-color:var(--lime);color:#182011}
.ico{font-size:24px}
.tag{font-size:10.5px;font-weight:700;border-radius:8px;padding:2px 7px;display:inline-block;margin-top:2px}
.tag.v{background:#1f3a3a;color:var(--cyan)}.tag.s{background:#2d2f3f;color:var(--muted)}
.reward{font-size:12px;color:var(--lime);font-weight:800;white-space:nowrap}
.btn{border:0;background:var(--lime);color:#1b2413;font-weight:800;border-radius:12px;padding:9px 13px;font-size:13px}
.btn.ghost{background:#222a3b;color:var(--text);border:1px solid var(--line)}
.btn.cyan{background:var(--cyan)}.btn:disabled{opacity:.5}
.btn.danger{background:#3a2430;color:var(--pink);border:1px solid #5b3345}
.stage{display:grid;place-items:center;position:relative;padding:6px 0}
.av{width:210px;height:240px;filter:drop-shadow(0 12px 10px #080a1180)}
.stat{margin-top:12px}.stat .row{font-size:13px}
.stat .track{height:9px}
.stat.f .fill{background:linear-gradient(90deg,#ff8f8f,#ffc2a1)}.stat.v .fill{background:linear-gradient(90deg,var(--cyan),#b6f5ef)}
.stat.m .fill{background:linear-gradient(90deg,var(--blue),#c2d6ff)}.stat.d .fill{background:linear-gradient(90deg,var(--gold),#ffe9b8)}
.item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#1a202e;margin-top:9px}
.item .e{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#283145;font-size:23px}
.chap{display:flex;gap:12px;padding:11px;border:1px solid var(--line);border-radius:14px;margin-top:9px;background:#1a202e}
.chap.cur{border-color:#91b850;background:#232b22}.chap.lock{opacity:.5}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cell{aspect-ratio:1;border-radius:7px;background:#232b3d;display:grid;place-items:center;font-size:10px;color:#6b7690}
.cell.ok{background:var(--lime);color:#1d2812}.cell.part{background:#63753a;color:#e8f3cc}.cell.sh{background:var(--cyan);color:#10343a}.cell.today{outline:2px solid var(--gold)}
.field{width:100%;background:#131824;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.s{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(16,19,29,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav-in{display:flex;width:100%;max-width:480px}
.tab{flex:1;border:0;background:none;padding:6px 0;color:var(--muted);font-size:11px;display:grid;gap:1px;justify-items:center}
.tab span{font-size:22px}.tab.on{color:var(--lime);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--lime);color:#192111;font-weight:800;padding:11px 16px;border-radius:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:92vw;text-align:center;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--pink)}
.modal{position:fixed;inset:0;background:#080b12cc;display:none;place-items:center;z-index:30;padding:24px}
.modal.show{display:grid}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center;max-width:340px;width:100%}
.modal .big{font-size:54px;font-weight:900;color:var(--lime);letter-spacing:-.04em}
.lockbox{border:1px dashed var(--line);border-radius:14px;padding:12px;margin-top:9px;color:var(--muted);font-size:13px}
.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1px solid var(--line);background:#1b2130;border-radius:14px;padding:10px 12px;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="view"></div>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script>
(()=>{
'use strict';
/* ---------- Configuración del juego ---------- */
const KEY='vida-en-juego-v2';
const ATTRS={fuerza:{n:'Fuerza',e:'💪',c:'f'},vitalidad:{n:'Vitalidad',e:'❤️',c:'v'},mente:{n:'Mente',e:'🧠',c:'m'},disciplina:{n:'Disciplina',e:'🛡️',c:'d'}};
const SLOT_LEVELS=[1,1,3,5,8,12];                 // nivel al que se desbloquea cada hueco de hábito
const CH=[
 {from:1, name:'El despertar', title:'Aprendiz', goal:'Aprende a aparecer cada día. Dos hábitos, nada más.'},
 {from:3, name:'El camino',    title:'Viajero',  goal:'Tercer hueco desbloqueado. Empieza a construir racha.'},
 {from:6, name:'La forja',     title:'Forjado',  goal:'La constancia ya pesa más que la motivación.'},
 {from:10,name:'La prueba',    title:'Probado',  goal:'Cinco hábitos y semanas completas.'},
 {from:15,name:'Leyenda',      title:'Leyenda',  goal:'Eres alguien disciplinado. Ahora solo toca mantenerlo.'}
];
const TUNIC=['#71e2dc','#7aa8ff','#c5f36a','#ffd276','#ff8fbd'];
const PRESETS=[
 {id:'steps',  name:'Llegar a 8.000 pasos',     icon:'👟',attr:'vitalidad',verify:{type:'steps',  target:8000}},
 {id:'workout',name:'Entrenar 30 minutos',      icon:'🏋️',attr:'fuerza',   verify:{type:'workout',target:30}},
 {id:'sleep',  name:'Dormir 7 horas o más',     icon:'🌙',attr:'vitalidad',verify:{type:'sleep',  target:7}},
 {id:'mindful',name:'Meditar 5 minutos',        icon:'🧘',attr:'mente',    verify:{type:'mindful',target:5}},
 {id:'read',   name:'Leer 10 minutos',          icon:'📖',attr:'mente'},
 {id:'water',  name:'Beber 2 litros de agua',   icon:'💧',attr:'vitalidad'},
 {id:'plan',   name:'Planificar el día',        icon:'🗒️',attr:'disciplina'},
 {id:'wake',   name:'Levantarme a mi hora',     icon:'⏰',attr:'disciplina'},
 {id:'phone',  name:'Sin móvil la 1ª hora',     icon:'📵',attr:'disciplina'}
];
const ITEMS=[{id:'hat',name:'Gorro de explorador',e:'🧢',cost:40},{id:'cape',name:'Capa estelar',e:'🦸',cost:90},{id:'crown',name:'Corona de luz',e:'👑',cost:160}];
const BOSSES=[['Sombra de la Pereza','👹'],['Rey del Sofá','🛋️'],['Dragón de la Excusa','🐉'],['Niebla del Mañana','🌫️']];
const XP_SELF=20, XP_VERIFIED=30, XP_DAY_BONUS=30, XP_BOSS=100;

/* ---------- Utilidades de fecha ---------- */
const keyOf=d=>d.toLocaleDateString('en-CA');
const T=()=>keyOf(new Date());
const parse=k=>new Date(k+'T12:00:00');
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)};
const weekKey=k=>addDays(k,-((parse(k).getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---------- Estado ---------- */
const fresh=()=>({xp:0,coins:0,attr:{fuerza:0,vitalidad:0,mente:0,disciplina:0},habits:[],days:{},owned:[],equipped:null,shields:1,lastSeen:null,lastShieldDay:null,bosses:{},sim:{day:null,steps:0,workoutMin:0,avgHR:0,sleepH:0,mindfulMin:0,manual:false}});
let data;try{data=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch{data=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
let ui={tab:'hoy'}, pendingModal=null;

/* ---------- Niveles, capítulos, huecos ---------- */
const need=l=>80+30*l;
function lv(xp){let l=1;while(xp>=need(l)){xp-=need(l);l++}return{level:l,cur:xp,next:need(l)}}
const chapterIdx=l=>CH.reduce((a,c,i)=>l>=c.from?i:a,0);
const slotsFor=l=>SLOT_LEVELS.filter(x=>x<=l).length;
const attrLevel=x=>Math.floor(Math.sqrt(x/25))+1;

/* ---------- Registro diario ---------- */
function rec(k){return data.days[k]||(data.days[k]={sched:[],done:[],xp:{},bonus:false,shielded:false})}
function isOk(k){const r=data.days[k];return !!r&&(r.shielded||(r.sched.length>0&&r.sched.every(i=>r.done.includes(i))))}
function streak(){let n=0,d=T();if(isOk(d))n++;d=addDays(d,-1);while(isOk(d)&&n<999){n++;d=addDays(d,-1)}return n}

function rollover(){
  const t=T(),notes=[];
  if(data.lastSeen&&data.lastSeen<t){
    let d=data.lastSeen,guard=0;
    while(d<t&&guard++<60){
      if(!isOk(d)&&isOk(addDays(d,-1))&&data.shields>0){rec(d).shielded=true;data.shields--;notes.push('🛡️ Un escudo protegió tu racha')}
      d=addDays(d,1);
    }
  }
  data.lastSeen=t;
  const r=rec(t);data.habits.forEach(h=>{if(!r.sched.includes(h.id))r.sched.push(h.id)});
  if(data.sim.day!==t)data.sim={day:t,steps:0,workoutMin:0,avgHR:0,sleepH:0,mindfulMin:0,manual:false};
  ensureBoss();save();
  if(notes.length)setTimeout(()=>toast(notes[0]),400);
}

/* ---------- Jefe semanal ---------- */
function ensureBoss(){const wk=weekKey(T());if(!data.bosses[wk])data.bosses[wk]={max:Math.max(5,Math.ceil(.7*7*Math.max(2,data.habits.length))),claimed:false}}
function bossDamage(wk){let n=0;for(let i=0;i<7;i++){const r=data.days[addDays(wk,i)];if(r)n+=r.done.length}return n}
function bossInfo(){const wk=weekKey(T());const b=data.bosses[wk];const idx=Math.floor(parse(wk).getTime()/6.048e8)%BOSSES.length;return{wk,b,dmg:bossDamage(wk),name:BOSSES[idx][0],emoji:BOSSES[idx][1]}}

/* ---------- Ganar / perder XP ---------- */
function gain(xp,attr){
  const b=lv(data.xp);data.xp+=xp;data.attr[attr]=(data.attr[attr]||0)+xp;data.coins+=Math.round(xp/2);
  const a=lv(data.xp);
  if(a.level>b.level)pendingModal={level:a.level,chapter:chapterIdx(a.level)>chapterIdx(b.level)?chapterIdx(a.level):null,slot:slotsFor(a.level)>slotsFor(b.level)};
}
function lose(xp,attr){data.xp=Math.max(0,data.xp-xp);data.attr[attr]=Math.max(0,(data.attr[attr]||0)-xp);data.coins=Math.max(0,data.coins-Math.round(xp/2))}

function afterAction(undo){
  const t=T(),r=rec(t);
  if(isOk(t)&&!r.bonus){
    r.bonus=true;gain(XP_DAY_BONUS,'disciplina');toast('🌟 ¡Día completo! +'+XP_DAY_BONUS+' XP');
    if(streak()%7===0&&data.lastShieldDay!==t){data.shields=Math.min(2,data.shields+1);data.lastShieldDay=t;toast('🛡️ Racha de '+streak()+' días: ganas un escudo')}
  }else if(undo&&r.bonus&&!isOk(t)){r.bonus=false;lose(XP_DAY_BONUS,'disciplina')}
  const bi=bossInfo();
  if(bi.b&&!bi.b.claimed&&bi.dmg>=bi.b.max){bi.b.claimed=true;gain(XP_BOSS,'disciplina');toast('⚔️ ¡Has derrotado a '+bi.name+'! +'+XP_BOSS+' XP')}
  save();render();
  if(pendingModal){showModal(pendingModal);pendingModal=null}
}

function complete(h,verified){
  const r=rec(T());if(r.done.includes(h.id))return;
  const xp=verified?XP_VERIFIED:XP_SELF;r.done.push(h.id);r.xp[h.id]=xp;gain(xp,h.attr);
  toast((verified?'⌚ Verificado':'✅ Hecho')+' · +'+xp+' XP');afterAction(false);
}
function undo(h){
  const r=rec(T());const i=r.done.indexOf(h.id);if(i<0||h.verify)return;
  r.done.splice(i,1);lose(r.xp[h.id]||XP_SELF,h.attr);delete r.xp[h.id];afterAction(true);
}

/* ---------- Salud (puente HealthKit) ----------
   En la app de iPhone (Capacitor) existe el plugin nativo "VidaHealth" y se leen
   los datos reales de Apple Salud. En un navegador normal se usa el simulador. */
const Health={
  _p:undefined,
  plugin(){
    if(this._p!==undefined)return this._p;
    const C=window.Capacitor;this._p=null;
    if(C&&typeof C.isNativePlatform==='function'&&C.isNativePlatform()){try{this._p=C.registerPlugin('VidaHealth')}catch{}}
    return this._p;
  },
  imported(){const h=data.health;return h&&h.day===T()?h:null},
  async today(){
    const p=this.plugin();
    if(p){await p.requestAuthorization();return p.today()}      // app nativa: lee Apple Salud
    const h=this.imported();if(h)return h;                       // web: datos importados del Atajo
    if(data.devMode)return Object.assign({},data.sim);           // modo prueba
    throw new Error('Primero importa tus datos de Salud de hoy (botón Importar).');
  },
  isReal(){return !!this.plugin()}
};
const hora=ts=>new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const resumen=s=>Math.round(s.steps).toLocaleString('es-ES')+' pasos · '+Math.round(s.workoutMin)+' min de entreno ('+Math.round(s.avgHR)+' lpm) · '+s.sleepH+' h de sueño · '+Math.round(s.mindfulMin)+' min de meditación';
/* Importa el texto JSON que copia el Atajo de iOS. Solo se aceptan datos con la fecha de hoy. */
function importHealth(text){
  let j;try{j=JSON.parse(text)}catch{return{ok:false,msg:'El portapapeles no contiene datos del Atajo.'}}
  if(!j||typeof j!=='object'||j.fecha!==T())return{ok:false,msg:'Los datos no son de hoy ('+((j&&j.fecha)||'sin fecha')+'). Ejecuta el Atajo otra vez.'};
  const n=(v,max)=>{v=Number(String(v).replace(',','.'));return isFinite(v)&&v>=0&&v<=max?v:0};
  data.health={day:T(),ts:Date.now(),steps:n(j.pasos,100000),workoutMin:n(j.entrenoMin,600),avgHR:n(j.pulsoMedio,230),sleepH:n(j.suenoH,24),mindfulMin:n(j.meditacionMin,600),manual:false};
  save();return{ok:true};
}
function evaluate(v,s){
  const f=n=>Math.round(n).toLocaleString('es-ES');
  if(s.manual&&v.type!=='steps')return{ok:false,msg:'Ese dato se introdujo a mano, no cuenta.'};
  switch(v.type){
    case 'steps':return s.steps>=v.target?{ok:true}:{ok:false,msg:'Llevas '+f(s.steps)+' de '+f(v.target)+' pasos.'};
    case 'workout':
      if(s.workoutMin<v.target)return{ok:false,msg:'Entreno registrado: '+f(s.workoutMin)+' de '+v.target+' min.'};
      if(s.avgHR<105)return{ok:false,msg:'Pulsación media de '+f(s.avgHR)+' lpm: muy baja para contar como entreno (mínimo 105).'};
      if(s.avgHR>195)return{ok:false,msg:'Pulsación media de '+f(s.avgHR)+' lpm: dato no válido.'};
      return{ok:true};
    case 'sleep':return s.sleepH>=v.target?{ok:true}:{ok:false,msg:'Sueño registrado: '+s.sleepH+' de '+v.target+' h.'};
    case 'mindful':return s.mindfulMin>=v.target?{ok:true}:{ok:false,msg:'Meditación registrada: '+f(s.mindfulMin)+' de '+v.target+' min.'};
  }
  return{ok:false,msg:'Hábito sin criterio.'};
}
async function verify(h){
  try{const s=await Health.today();const res=evaluate(h.verify,s);if(res.ok)complete(h,true);else toast(res.msg,true)}
  catch(err){toast((err&&err.message)||'No pude leer los datos de Salud.',true)}
}

/* ---------- Lectura de capturas (OCR en el propio móvil) ---------- */
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const parseNum=s=>{s=String(s).replace(/\s/g,'');return /^\d{1,3}([.,]\d{3})+$/.test(s)?parseInt(s.replace(/[.,]/g,''),10):parseFloat(s.replace(',','.'))};
const MONTHS=[['ene','jan'],['feb'],['mar'],['abr','apr'],['may'],['jun'],['jul'],['ago','aug'],['sep','sept'],['oct'],['nov'],['dic','dec']];
function looksToday(t,d){
  if(/\b(hoy|today)\b/.test(t))return true;
  const day=d.getDate();
  return MONTHS[d.getMonth()].some(m=>new RegExp('\\b'+day+'\\s*(de\\s+)?'+m).test(t)||new RegExp(m+'\\w*\\.?\\s+'+day+'\\b').test(t));
}
/* Extrae de un texto de pantalla de Salud/Fitness los datos que sabemos verificar. */
function parseHealthText(raw,now){
  const t=norm(raw).replace(/[|]/g,' ');const out={};let m;
  m=t.match(/(\d{1,3}(?:[.,\s]\d{3})+|\d{1,6})\s*(?:pasos|steps)\b/)||t.match(/\b(?:pasos|steps)\b\D{0,15}(\d{1,3}(?:[.,]\d{3})+|\d{1,6})/);
  if(m){const v=parseNum(m[1]);if(v>=0&&v<=100000)out.steps=v}
  m=t.match(/(?:media|average|avg)\D{0,25}(\d{2,3})\s*(?:lpm|ppm|bpm)/)||t.match(/(\d{2,3})\s*(?:lpm|ppm|bpm)/);
  if(m){const v=parseInt(m[1],10);if(v>=30&&v<=230)out.avgHR=v}
  m=t.match(/(?:tiempo de entrenamiento|tiempo|duracion|duration|workout time)\D{0,12}(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m){const a=+m[1],b=+m[2],c=m[3]?+m[3]:null;const min=c===null?a+b/60:a*60+b+c/60;if(min>0&&min<600)out.workoutMin=Math.round(min)}
  if(/dorm|sleep|sueno|asleep/.test(t)){m=t.match(/(\d{1,2})\s*(?:h|hr|hrs|horas?)\b(?:\s*(\d{1,2})\s*min)?/);if(m){const v=+m[1]+(m[2]?+m[2]/60:0);if(v>0&&v<=24)out.sleepH=Math.round(v*10)/10}}
  if(/mindful|atencion plena|meditaci/.test(t)){m=t.match(/(\d{1,3})\s*min\b/);if(m)out.mindfulMin=+m[1]}
  return{out,today:looksToday(t,now||new Date())};
}
window.VEJ_TEST={parseHealthText};

let _tw=null;
async function ocrWorker(progress){
  if(!window.Tesseract){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('Sin conexión: no pude cargar el lector de texto.'));document.head.appendChild(s)});
  }
  if(!_tw)_tw=await Tesseract.createWorker('eng',1,{logger:progress});
  return _tw;
}
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,2200/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;let sum=0;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;sum+=g}
  if(sum/(d.length/4)<115)for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=255-d[i]}   // modo oscuro → texto oscuro sobre fondo claro
  x.putImageData(im,0,0);return c;
}
let shotRes=null;
const showBox=h=>{$('modalBox').innerHTML=h;$('modal').classList.add('show')};
function shotSummary(r){
  const rows=[];
  if(r.steps!==undefined)rows.push('👟 '+Math.round(r.steps).toLocaleString('es-ES')+' pasos');
  if(r.workoutMin!==undefined)rows.push('🏋️ '+r.workoutMin+' min de entreno');
  if(r.avgHR!==undefined)rows.push('❤️ '+r.avgHR+' lpm de pulso medio');
  if(r.sleepH!==undefined)rows.push('🌙 '+r.sleepH+' h de sueño');
  if(r.mindfulMin!==undefined)rows.push('🧘 '+r.mindfulMin+' min de meditación');
  return rows;
}
async function handleShots(files){
  if(!files.length)return;
  const merged={},notes=[];
  try{
    for(let i=0;i<files.length;i++){
      showBox(`<div class="eyebrow">Leyendo capturas</div><p>Captura ${i+1} de ${files.length}…</p><p class="small muted" id="ocrp">Preparando el lector (la primera vez descarga unos megas)</p>`);
      const w=await ocrWorker(m=>{const el=$('ocrp');if(el&&m&&m.status)el.textContent=m.status==='recognizing text'?'Leyendo texto… '+Math.round((m.progress||0)*100)+'%':'Preparando el lector…'});
      const cv=await prepImage(files[i]);
      const res=await w.recognize(cv);
      const r=parseHealthText(res.data.text,new Date());
      if(!Object.keys(r.out).length){notes.push('Captura '+(i+1)+': no reconocí ningún dato.');continue}
      const lm=files[i].lastModified,real=lm>0&&Math.abs(Date.now()-lm)>120000;
      if(!(r.today||(real&&Date.now()-lm<20*36e5))){notes.push('Captura '+(i+1)+': no veo que sea de hoy, así que no la uso.');continue}
      Object.assign(merged,r.out);
    }
  }catch(err){showBox(`<div class="eyebrow" style="color:var(--pink)">No pude leer la captura</div><p class="small">${esc((err&&err.message)||err)}</p><button class="btn" data-act="closeModal" style="width:100%">Cerrar</button>`);return}
  const rows=shotSummary(merged);
  if(!rows.length){showBox(`<div class="eyebrow" style="color:var(--pink)">Sin datos</div><p class="small">${notes.map(esc).join('<br>')||'No encontré datos.'}</p><p class="small muted">Haz la captura con el día de hoy visible y el número bien claro.</p><button class="btn" data-act="closeModal" style="width:100%">Cerrar</button>`);return}
  shotRes=merged;
  showBox(`<div class="eyebrow">He leído esto</div><p style="line-height:1.9;margin:10px 0">${rows.join('<br>')}</p>${notes.length?`<p class="small muted">${notes.map(esc).join('<br>')}</p>`:''}<p class="small muted">Si algún número no es el que ves, cancela y haz otra captura.</p><div class="row"><button class="btn ghost" data-act="closeModal" style="flex:1">Cancelar</button><button class="btn" data-act="shotApply" style="flex:1">Usar</button></div>`);
}
function applyShots(){
  if(!shotRes)return;
  const prev=Health.imported()||{steps:0,workoutMin:0,avgHR:0,sleepH:0,mindfulMin:0};
  data.health=Object.assign({},prev,shotRes,{day:T(),ts:Date.now(),manual:false,source:'captura'});
  shotRes=null;save();$('modal').classList.remove('show');render();toast('📷 Datos de hoy guardados');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id,h=data.habits.find(x=>x.id===id);
  switch(b.dataset.act){
    case 'shotApply':applyShots();break;
    case 'closeModal':$('modal').classList.remove('show');break;
    case 'toggle':if(h){const r=rec(T());r.done.includes(h.id)?undo(h):complete(h,false)}break;
    case 'verify':if(h)verify(h);break;
    case 'adopt':{
      const p=PRESETS.find(x=>x.id===id);if(!p||slotsFor(lv(data.xp).level)<=data.habits.length)break;
      data.habits.push({id:p.id,name:p.name,icon:p.icon,attr:p.attr,verify:p.verify||null});
      const r=rec(T());if(!r.sched.includes(p.id))r.sched.push(p.id);save();render();toast('Nueva misión añadida');break}
    case 'del':if(h){data.habits=data.habits.filter(x=>x.id!==id);const r=rec(T());r.sched=r.sched.filter(i=>i!==id);save();render()}break;
    case 'buy':{
      const it=ITEMS.find(x=>x.id===id);if(!it)break;
      if(data.owned.includes(id))data.equipped=data.equipped===id?null:id;
      else if(data.coins>=it.cost){data.coins-=it.cost;data.owned.push(id);data.equipped=id;toast(it.name+' desbloqueado ✨')}
      save();render();break}
    case 'import':navigator.clipboard.readText().then(t=>{const r=importHealth(t);if(r.ok){toast('⌚ Datos de Salud importados');render()}else toast(r.msg,true)}).catch(()=>toast('No pude leer el portapapeles. Pulsa «Pegar» cuando iOS lo pregunte.',true));break;
    case 'backup':navigator.clipboard.writeText(JSON.stringify(data)).then(()=>toast('Copia guardada en el portapapeles')).catch(()=>toast('No pude copiar',true));break;
    case 'restore':navigator.clipboard.readText().then(t=>{const j=JSON.parse(t);if(typeof j.xp!=='number'||!Array.isArray(j.habits))throw 0;if(!confirm('¿Sustituir tu partida actual por la copia?'))return;data=Object.assign(fresh(),j);rollover();render();toast('Partida restaurada')}).catch(()=>toast('El portapapeles no tiene una copia válida',true));break;
    case 'healthdebug':Health.today().then(s=>toast('Pasos '+Math.round(s.steps)+' · Entreno '+Math.round(s.workoutMin)+' min · '+Math.round(s.avgHR)+' lpm · Sueño '+s.sleepH+' h · Meditación '+Math.round(s.mindfulMin)+' min')).catch(err=>toast('Error: '+(err&&err.message||err),true));break;
    case 'simfill':data.sim=Object.assign(data.sim,{steps:9200,workoutMin:38,avgHR:128,sleepH:7.5,mindfulMin:6,manual:false});save();render();break;
    case 'simzero':data.sim=Object.assign(data.sim,{steps:0,workoutMin:0,avgHR:0,sleepH:0,mindfulMin:0,manual:false});save();render();break;
    case 'reset':if(confirm('¿Borrar toda tu partida? No se puede deshacer.')){data=fresh();rollover();render();toast('Partida reiniciada')}break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.hasAttribute&&e.target.hasAttribute('data-shot')){const fs=[...e.target.files];e.target.value='';handleShots(fs);return}
  if(e.target.hasAttribute&&e.target.hasAttribute('data-dev')){data.devMode=e.target.checked;save();render();return}
  const s=e.target.dataset&&e.target.dataset.sim;if(!s)return;
  data.sim[s]=s==='manual'?e.target.checked:Math.max(0,parseFloat(e.target.value)||0);save();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='custom')return;e.preventDefault();
  const f=new FormData(e.target),name=String(f.get('name')||'').trim(),attr=String(f.get('attr'));
  if(!name||!ATTRS[attr]||slotsFor(lv(data.xp).level)<=data.habits.length)return;
  const id='c_'+name.toLowerCase().replace(/[^a-z0-9áéíóúñü]+/g,'-');
  if(data.habits.some(x=>x.id===id))return toast('Ya tienes ese hábito',true);
  data.habits.push({id,name,icon:'🌱',attr,verify:null});
  const r=rec(T());if(!r.sched.includes(id))r.sched.push(id);save();render();toast('Hábito añadido');
});

rollover();render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
